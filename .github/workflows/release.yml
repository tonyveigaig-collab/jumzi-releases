# JUMZI desktop: build, test and publish the installers.
# Lives in the public jumzi-releases repository (copied there by scripts/desktop-sync.mjs from the main repo).
#
#   push a tag vX.Y.Z  → build every installer → install and run each one on its own system → publish the release
#   Actions → "Desktop release" → Run workflow → build and test only (publish: false), or publish too
#
# Signing (optional, used when the secrets exist):
#   Windows: WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD
#   macOS:   MAC_CSC_LINK (base64 .p12 "Developer ID Application") + MAC_CSC_KEY_PASSWORD
#            APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID  → notarization
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar a versão depois dos testes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.name }}
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, args: "--win nsis msi --x64" }
          - { name: windows-arm64, os: windows-latest, args: "--win nsis msi --arm64 -c.publish.channel=latest-arm64" }
          - { name: mac, os: macos-15, args: "--mac dmg zip --x64 --arm64" }
          - { name: linux-x64, os: ubuntu-24.04, args: "--linux AppImage deb rpm --x64" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, args: "--linux AppImage deb rpm --arm64" }
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - name: Build installers
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            echo "::warning::${{ matrix.name }}: sem certificado — instaladores NÃO assinados"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then EXTRA="-c.mac.notarize=true"; else EXTRA="-c.mac.notarize=false"; fi
          fi
          npx electron-builder ${{ matrix.args }} --publish never $EXTRA
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cd dist
          for f in *.exe *.msi *.dmg *.zip *.AppImage *.deb *.rpm *.blockmap latest*.yml; do [ -f "$f" ] && cp "$f" ../out/; done
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  test-windows:
    name: Test ${{ matrix.name }}
    needs: build
    # Test whatever was built, even if another system's build failed (publishing still needs all).
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, arch: x64 }
          - { name: windows-arm64, os: windows-11-arm, arch: arm64 }
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: "${{ matrix.name }}", path: pkg }
      - name: Install (.exe) and run
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "pkg\JUMZI-Setup-${{ matrix.arch }}.exe" -ArgumentList "/S" -PassThru
          if (-not $p.WaitForExit(300000)) { throw "installer did not finish in 5 min" }
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\jumzi-desktop\JUMZI.exe"
          if (-not (Test-Path $exe)) { throw "JUMZI.exe not installed at $exe" }
          if (-not (Get-ItemProperty "HKCU:\Software\Classes\jumzi" -ErrorAction SilentlyContinue)) { throw "jumzi:// not registered" }
          $r = Start-Process -FilePath $exe -ArgumentList "--smoke-test","--smoke-out=$pwd\smoke-exe.json" -PassThru
          if (-not $r.WaitForExit(180000)) { throw "app did not finish the smoke test in 3 min" }
          Get-Content smoke-exe.json
          if ($r.ExitCode -ne 0) { throw "smoke test failed ($($r.ExitCode))" }
          $u = Start-Process -FilePath "$env:LOCALAPPDATA\Programs\jumzi-desktop\Uninstall JUMZI.exe" -ArgumentList "/S" -PassThru
          [void]$u.WaitForExit(120000)
          "uninstall exit $($u.ExitCode)"
      - name: Install (.msi) and run
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -ArgumentList "/i","pkg\JUMZI-${{ matrix.arch }}.msi","/qn","/norestart","/l*v","msi.log" -PassThru
          if (-not $p.WaitForExit(420000)) { Get-Content msi.log -Tail 80; throw "msiexec did not finish in 7 min" }
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 60; throw "msiexec exit $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Recurse -Filter JUMZI.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "JUMZI.exe not found after MSI install" }
          $r = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test","--smoke-out=$pwd\smoke-msi.json" -PassThru
          if (-not $r.WaitForExit(180000)) { throw "app did not finish the smoke test in 3 min" }
          Get-Content smoke-msi.json
          if ($r.ExitCode -ne 0) { throw "smoke test failed ($($r.ExitCode))" }
          $u = Start-Process msiexec.exe -ArgumentList "/x","pkg\JUMZI-${{ matrix.arch }}.msi","/qn","/norestart" -PassThru
          [void]$u.WaitForExit(300000)
          "uninstall exit $($u.ExitCode)"
      - name: Signature
        shell: pwsh
        run: Get-AuthenticodeSignature pkg\*.exe, pkg\*.msi | Format-Table Status, StatusMessage, Path -AutoSize

  test-mac:
    name: Test mac-${{ matrix.arch }}
    needs: build
    # Test whatever was built, even if another system's build failed (publishing still needs all).
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, os: macos-15 }
          - { arch: x64, os: macos-15-intel }
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: mac, path: pkg }
      - name: Install (.dmg) and run
        run: |
          hdiutil attach -nobrowse -mountpoint /Volumes/JUMZI "pkg/JUMZI-${{ matrix.arch }}.dmg"
          cp -R /Volumes/JUMZI/JUMZI.app /Applications/
          hdiutil detach /Volumes/JUMZI
          file /Applications/JUMZI.app/Contents/MacOS/JUMZI
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" /Applications/JUMZI.app/Contents/Info.plist | grep -qx jumzi
          codesign --verify --deep --strict --verbose=2 /Applications/JUMZI.app
          /Applications/JUMZI.app/Contents/MacOS/JUMZI --smoke-test --smoke-out="$PWD/smoke.json"
          cat smoke.json
      - name: Gatekeeper (signed builds)
        run: |
          spctl --assess --type execute --verbose /Applications/JUMZI.app || echo "::warning::Não assinado/notarizado: o macOS vai pedir confirmação ao abrir"

  test-linux:
    name: Test linux-${{ matrix.arch }}
    needs: build
    # Test whatever was built, even if another system's build failed (publishing still needs all).
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-24.04, deb: amd64, rpm: x86_64, appimage: x86_64 }
          - { arch: arm64, os: ubuntu-24.04-arm, deb: arm64, rpm: aarch64, appimage: arm64 }
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: "linux-${{ matrix.arch }}", path: pkg }
      - name: Install (.deb) and run
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb "./pkg/jumzi_${{ matrix.deb }}.deb"
          grep -q "x-scheme-handler/jumzi" /usr/share/applications/jumzi.desktop
          xvfb-run -a jumzi --smoke-test --smoke-out="$PWD/smoke-deb.json"
          cat smoke-deb.json
          sudo apt-get remove -y jumzi-desktop
      - name: AppImage
        run: |
          chmod +x "pkg/JUMZI-${{ matrix.appimage }}.AppImage"
          xvfb-run -a "pkg/JUMZI-${{ matrix.appimage }}.AppImage" --appimage-extract-and-run --no-sandbox --smoke-test --smoke-out="$PWD/smoke-appimage.json"
          cat smoke-appimage.json
      - name: Install (.rpm) on Fedora and run
        run: |
          docker run --rm --shm-size=1g -v "$PWD:/w" fedora:41 bash -euxc '
            dnf install -y "/w/pkg/jumzi-${{ matrix.rpm }}.rpm" xorg-x11-server-Xvfb xorg-x11-xauth which >/dev/null
            grep -q "x-scheme-handler/jumzi" /usr/share/applications/jumzi.desktop
            xvfb-run -a /opt/JUMZI/jumzi --no-sandbox --smoke-test --smoke-out=/w/smoke-rpm.json
          '
          cat smoke-rpm.json

  publish:
    name: Publish release
    needs: [test-windows, test-mac, test-linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          # Older download links pointed at JUMZI-Setup.exe: keep it as the x64 installer.
          cp dist/JUMZI-Setup-x64.exe dist/JUMZI-Setup.exe
          ls -la dist
          cat > notes.md <<EOF
          JUMZI $VERSION para Windows, macOS e Linux.

          Baixe pela central oficial: https://jumzi.vercel.app/download

          - Windows 10/11: JUMZI-Setup-x64.exe (ou -arm64), MSI para empresas
          - macOS 11+: JUMZI-arm64.dmg (chip Apple) ou JUMZI-x64.dmg (Intel)
          - Linux: .deb (Ubuntu/Debian), .rpm (Fedora/RHEL) ou AppImage, x64 e ARM64

          Cada instalador foi instalado e aberto automaticamente no seu sistema antes desta publicação.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "JUMZI $VERSION" --notes-file notes.md --latest
          fi
